/* ---------- event delegation ---------- */
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'go-view':
      state.activeView = el.dataset.view;
      render();
      break;
    case 'week-prev': {
      const d = new Date(state.scheduleWeekStart); d.setDate(d.getDate()-7);
      state.scheduleWeekStart = d;
      renderSchedule();
      break;
    }
    case 'week-next': {
      const d = new Date(state.scheduleWeekStart); d.setDate(d.getDate()+7);
      state.scheduleWeekStart = d;
      renderSchedule();
      break;
    }
    case 'week-today':
      state.scheduleWeekStart = mondayOf(new Date());
      renderSchedule();
      break;
    case 'open-add-event':
      openAddEventModal(null);
      break;
    case 'open-edit-event':
      openAddEventModal(el.dataset.id);
      break;
    case 'delete-event': {
      e.stopPropagation();
      const ev = state.events.find(x=>x.id===el.dataset.id);
      if(!ev) break;
      const ok = await confirmModal(`Delete "${ev.title}"?`, {confirmLabel:'Delete event'});
      if(!ok) break;
      await dbDelete('events', ev.id);
      state.events = state.events.filter(x=>x.id!==ev.id);
      renderSchedule();
      break;
    }
    case 'open-add-transaction':
      openAddTransactionModal(null, el.dataset.type);
      break;
    case 'open-edit-transaction':
      openAddTransactionModal(el.dataset.id);
      break;
    case 'delete-transaction': {
      e.stopPropagation();
      const t = state.transactions.find(x=>x.id===el.dataset.id);
      if(!t) break;
      const ok = await confirmModal(`Delete this ${t.type} of ${fmtMoney(t.amount)}?`, {confirmLabel:'Delete'});
      if(!ok) break;
      await dbDelete('transactions', t.id);
      state.transactions = state.transactions.filter(x=>x.id!==t.id);
      renderFinance();
      break;
    }
    case 'toggle-goal': {
      const g = goalById(el.dataset.id);
      if(!g) break;
      if(goalStatus(g)==='locked') break;
      g.completed = !g.completed;
      g.completedAt = g.completed ? Date.now() : null;
      await dbPut('goals', g);
      if(g.completed) await recordStreakActivity();
      renderGoals();
      break;
    }
    case 'open-add-goal':
      openAddGoalModal(el.dataset.parent || null);
      break;
    case 'delete-goal': {
      e.stopPropagation();
      const g = goalById(el.dataset.id);
      if(!g) break;
      const ids = collectGoalDescendants(g.id);
      const msg = ids.length>1 ? `Delete "${g.title}" and its ${ids.length-1} follow-up goal(s)?` : `Delete "${g.title}"?`;
      const ok = await confirmModal(msg, {confirmLabel:'Delete'});
      if(!ok) break;
      for(const id of ids) await dbDelete('goals', id);
      state.goals = state.goals.filter(x=>!ids.includes(x.id));
      renderGoals();
      break;
    }
    case 'generate-goals-from-schedule':
      await generateGoalsFromSchedule();
      break;
    case 'select-class':
      state.activeClassId = el.dataset.id;
      state.activeView = 'classwork';
      state.classSubtab = 'files';
      state.filesFilter = {search:'', category:'all'};
      render();
      break;
    case 'open-add-class':
      openAddClassModal(null);
      break;
    case 'open-edit-class':
      openAddClassModal(el.dataset.id);
      break;
    case 'delete-class':
      await deleteClass(el.dataset.id);
      break;
    case 'set-subtab':
      state.classSubtab = el.dataset.tab;
      renderClassworkSubtabOnly();
      break;
    case 'set-studytab':
      state.studyTab = el.dataset.tab;
      state.genPreview = null;
      renderStudyPanel();
      break;
    case 'filter-category':
      state.filesFilter.category = el.dataset.key;
      document.querySelectorAll('#category-chips .chip').forEach(c=>c.classList.toggle('active', c.dataset.key===el.dataset.key));
      renderFileGrid();
      break;
    case 'open-upload':
      openUploadModal(el.dataset.category || null);
      break;
    case 'open-file':
      openFile(el.dataset.id, el.dataset.page || null);
      break;
    case 'delete-file':
      await deleteFile(el.dataset.id);
      break;
    case 'generate-from-file': {
      state.studyTab = 'generate';
      renderStudyPanel();
      const c = state.classes.find(x=>x.id===state.activeClassId);
      const f = (state.filesByClass[c.id]||[]).find(x=>x.id===el.dataset.id);
      if(f && f.extractedText) runGeneration(fileToSources(f));
      break;
    }
    case 'confirm-generated': {
      const c = state.classes.find(x=>x.id===state.activeClassId);
      const toAdd = state.genPreview.filter(q=>q._include);
      for(const q of toAdd){
        const rec = {id:uid(), classId:c.id, fileId:q.sourceFileId||null, sourceFileName:q.sourceFileName||null, sourcePage:q.sourcePage||null, kind:q.kind, prompt:q.prompt, answer:q.answer, snippet:q.snippet, createdAt:Date.now(), stats:{seen:0,correct:0}};
        await dbPut('questions', rec);
        state.questionsByClass[c.id].unshift(rec);
      }
      toast(`Added ${toAdd.length} question${toAdd.length===1?'':'s'}`);
      state.genPreview = null;
      state.studyTab = 'flashcards';
      renderStudyPanel();
      break;
    }
    case 'cancel-generated':
      state.genPreview = null;
      renderGenerateTab();
      break;
    case 'open-add-card':
      openAddCardModal();
      break;
    case 'regenerate-syllabus-summary':
      await regenerateSyllabusSummary();
      break;
    case 'add-grade-item': {
      const c = state.classes.find(x=>x.id===state.activeClassId);
      if(!c.gradeItems) c.gradeItems = [];
      c.gradeItems.push({id:uid(), label:'New component', weight:0, score:null});
      await dbPut('classes', c);
      renderGradesTab();
      break;
    }
    case 'delete-grade-item': {
      const c = state.classes.find(x=>x.id===state.activeClassId);
      c.gradeItems = (c.gradeItems||[]).filter(g=>g.id!==el.dataset.id);
      await dbPut('classes', c);
      renderGradesTab();
      break;
    }
    case 'flip-card': {
      const id = el.dataset.id;
      if(state.flippedCards.has(id)) state.flippedCards.delete(id); else state.flippedCards.add(id);
      const cardEl = el.closest('.flip-card');
      if(cardEl) cardEl.classList.toggle('flipped');
      break;
    }
    case 'delete-card': {
      e.stopPropagation();
      const c = state.classes.find(x=>x.id===state.activeClassId);
      const ok = await confirmModal('Delete this flashcard?', {confirmLabel:'Delete card'});
      if(!ok) break;
      await dbDelete('questions', el.dataset.id);
      state.questionsByClass[c.id] = state.questionsByClass[c.id].filter(q=>q.id!==el.dataset.id);
      renderFlashcardsTab();
      break;
    }
    case 'delete-all-cards': {
      const c = state.classes.find(x=>x.id===state.activeClassId);
      const n = (state.questionsByClass[c.id]||[]).length;
      const ok = await confirmModal(`Delete all ${n} flashcard${n===1?'':'s'} in this class? This cannot be undone.`, {confirmLabel:'Delete all'});
      if(!ok) break;
      await dbDeleteWhere('questions','classId', c.id);
      state.questionsByClass[c.id] = [];
      renderFlashcardsTab();
      break;
    }
    case 'start-quiz': {
      const c = state.classes.find(x=>x.id===state.activeClassId);
      const source = document.getElementById('quiz-source').value;
      const count = Math.max(1, parseInt(document.getElementById('quiz-count').value)||10);
      let pool = (state.questionsByClass[c.id]||[]).slice();
      if(source==='weak'){
        pool.sort((a,b)=>{
          const ra = a.stats.seen ? a.stats.correct/a.stats.seen : -1;
          const rb = b.stats.seen ? b.stats.correct/b.stats.seen : -1;
          return ra-rb;
        });
        pool = pool.slice(0, count);
      }else{
        pool = shuffle(pool).slice(0, count);
      }
      state.quiz = {classId:c.id, queue:pool, index:0, showAnswer:false, results:[], score:0};
      renderStudyPanel();
      break;
    }
    case 'show-quiz-answer':
      state.quiz.showAnswer = true;
      renderQuizSession(document.getElementById('study-inner'));
      break;
    case 'grade-quiz': {
      const correct = el.dataset.correct==='1';
      const q = state.quiz.queue[state.quiz.index];
      q.stats.seen++; if(correct) q.stats.correct++;
      dbPut('questions', q);
      state.quiz.results.push({id:q.id, correct});
      if(correct) state.quiz.score++;
      state.quiz.index++;
      state.quiz.showAnswer = false;
      renderQuizSession(document.getElementById('study-inner'));
      break;
    }
    case 'retry-missed': {
      const c = state.classes.find(x=>x.id===state.activeClassId);
      const missedIds = new Set(state.quiz.results.filter(r=>!r.correct).map(r=>r.id));
      const pool = (state.questionsByClass[c.id]||[]).filter(q=>missedIds.has(q.id));
      state.quiz = {classId:c.id, queue:shuffle(pool), index:0, showAnswer:false, results:[], score:0};
      renderQuizSession(document.getElementById('study-inner'));
      break;
    }
    case 'end-quiz':
      state.quiz = null;
      renderStudyPanel();
      break;
    case 'quickfind-goto': {
      state.activeClassId = el.dataset.classid;
      state.activeView = 'classwork';
      state.classSubtab = 'files';
      state.filesFilter = {search:'', category:'all'};
      render();
      document.getElementById('quickfind-input').value='';
      setTimeout(()=>{
        const card = document.getElementById('file-'+el.dataset.fileid);
        if(card){ card.scrollIntoView({behavior:'smooth', block:'center'}); card.classList.add('highlight'); setTimeout(()=>card.classList.remove('highlight'), 1800); }
      }, 60);
      break;
    }
    case 'toggle-theme': {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur==='dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('co-theme', next);
      renderSidebar();
      break;
    }
    case 'close-modal':
      closeModal();
      break;
  }
});

/* ---------- grade item inputs (change fires on blur/enter, then re-render stats) ---------- */
document.addEventListener('change', async (e)=>{
  const t = e.target;
  if(t.id === 'schedule-date-jump' && t.value){
    const [y,m,d] = t.value.split('-').map(Number);
    state.scheduleWeekStart = mondayOf(new Date(y, m-1, d));
    renderSchedule();
    return;
  }
  const id = t.dataset && t.dataset.id;
  if(!id) return;
  if(t.classList.contains('grade-label-input')){
    await updateGradeItem(id, {label: t.value.trim() || 'Untitled'});
    renderGradesTab();
  }else if(t.classList.contains('grade-weight-input')){
    const v = parseFloat(t.value);
    await updateGradeItem(id, {weight: isNaN(v) ? 0 : Math.max(0, v)});
    renderGradesTab();
  }else if(t.classList.contains('grade-score-input')){
    const v = t.value === '' ? null : parseFloat(t.value);
    await updateGradeItem(id, {score: (v==null || isNaN(v)) ? null : Math.max(0, Math.min(100, v))});
    renderGradesTab();
  }
});

/* ---------- init ---------- */
function showFatalError(title, detail){
  const app = document.getElementById('app');
  if(app) app.style.display = 'none';
  let box = document.getElementById('fatal-error-box');
  if(!box){
    box = document.createElement('div');
    box.id = 'fatal-error-box';
    document.body.appendChild(box);
  }
  box.style.cssText = 'max-width:560px;margin:10vh auto;padding:28px 30px;background:var(--bg-elev);color:var(--text);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border);';
  box.innerHTML = `
    <div style="font-size:18px;font-weight:700;margin-bottom:10px;color:var(--danger)">${esc(title)}</div>
    <div style="font-size:13.5px;line-height:1.65;white-space:pre-wrap">${esc(detail)}</div>
  `;
}
let authMode = 'signin';
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('auth-title').textContent = mode==='signin' ? 'Sign in' : 'Create account';
  document.getElementById('auth-submit-btn').textContent = mode==='signin' ? 'Sign in' : 'Sign up';
  document.getElementById('auth-switch').innerHTML = mode==='signin'
    ? 'No account? <a data-action="auth-toggle-mode">Sign up</a>'
    : 'Have an account? <a data-action="auth-toggle-mode">Sign in</a>';
  document.getElementById('lock-error').textContent = '';
}
function usernameToEmail(username){
  const clean = username.toLowerCase().replace(/[^a-z0-9_.-]/g,'');
  return `${clean}@classwork-organizer.local`;
}
async function tryAuthSubmit(){
  const usernameRaw = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const errEl = document.getElementById('lock-error');
  errEl.textContent = '';
  if(!usernameRaw || !password){ errEl.textContent = 'Enter username and password'; return; }
  if(!/^[a-zA-Z0-9_.-]{3,}$/.test(usernameRaw)){ errEl.textContent = 'Username: 3+ chars, letters/numbers/._- only'; return; }
  const email = usernameToEmail(usernameRaw);
  const btn = document.getElementById('auth-submit-btn');
  btn.disabled = true;
  try{
    if(authMode==='signin'){
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){ errEl.textContent = error.message; return; }
      _cachedUid = data.session.user.id;
      await enterApp();
    }else{
      const { error } = await sb.auth.signUp({ email, password, options: { data: { username: usernameRaw } } });
      if(error){ errEl.textContent = error.message; return; }
      await sb.auth.signOut();
      _cachedUid = null;
      document.getElementById('auth-password').value = '';
      errEl.style.color = 'var(--success)';
      errEl.textContent = 'Account created — sign in below.';
      setAuthMode('signin');
      document.getElementById('auth-email').value = usernameRaw;
      document.getElementById('auth-password').focus();
    }
  }finally{
    btn.disabled = false;
  }
}
document.getElementById('auth-password').addEventListener('keydown', e=>{ if(e.key==='Enter') tryAuthSubmit(); });
document.getElementById('auth-email').addEventListener('keydown', e=>{ if(e.key==='Enter') tryAuthSubmit(); });
document.addEventListener('click', e=>{
  if(e.target.closest('[data-action="auth-submit"]')) tryAuthSubmit();
  if(e.target.closest('[data-action="auth-toggle-mode"]')){ errEl_reset(); setAuthMode(authMode==='signin' ? 'signup' : 'signin'); }
  if(e.target.closest('[data-action="sign-out"]')){ signOutNow(); }
});
function errEl_reset(){ const e=document.getElementById('lock-error'); e.style.color=''; }
const IDLE_TIMEOUT_MS = 15*60*1000;
let _idleTimer = null;
function signOutNow(){
  _cachedUid = null;
  stopIdleTimer();
  sb.auth.signOut().then(()=>location.reload());
}
function resetIdleTimer(){
  clearTimeout(_idleTimer);
  _idleTimer = setTimeout(signOutNow, IDLE_TIMEOUT_MS);
}
function startIdleTimer(){
  ['mousemove','keydown','click','touchstart','scroll'].forEach(ev=>document.addEventListener(ev, resetIdleTimer, {passive:true}));
  resetIdleTimer();
}
function stopIdleTimer(){
  clearTimeout(_idleTimer);
  _idleTimer = null;
}
async function enterApp(){
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app').style.display = '';
  startIdleTimer();
  await boot();
}
(function start(){
  if(!SUPABASE_URL || SUPABASE_URL.includes('YOUR-PROJECT')){
    showFatalError(
      'Supabase is not configured',
      'Set SUPABASE_URL and SUPABASE_ANON_KEY near the top of the script section in index.html, using the values from your Supabase project (Project Settings > API).'
    );
    return;
  }
  let started = false;
  sb.auth.onAuthStateChange((event, session)=>{
    if(started) return;
    if(event === 'INITIAL_SESSION' || event === 'SIGNED_IN'){
      started = true;
      if(session){
        _cachedUid = session.user.id;
        enterApp();
      }else{
        document.getElementById('auth-email').focus();
      }
    }
  });
  setTimeout(async ()=>{
    if(started) return;
    started = true;
    const { data } = await sb.auth.getSession();
    if(data.session){ _cachedUid = data.session.user.id; enterApp(); }
    else document.getElementById('auth-email').focus();
  }, 3000);
})();
async function boot(){
  try{
    const savedTheme = localStorage.getItem('co-theme');
    if(savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
  }catch(e){}
  try{
    await loadAll();
    render();
  }catch(err){
    console.error('Classwork Organizer failed to start', err);
    showFatalError(
      'Something went wrong loading your data',
      'Error: ' + (err && err.message ? err.message : String(err)) + '\n\nTry reloading the page. If it keeps happening, check the browser console for details.'
    );
  }
}
</script>
